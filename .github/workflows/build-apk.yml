name: Build & Sign SHΞN™ tunnel ᴢᴇʀᴏ Release APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sign:
    name: Build & Sign Google-Compliant APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode Permanent Google Keystore
        id: setup-keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding permanent Google-compliant keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            echo "KEYSTORE_EXISTS=true" >> $GITHUB_OUTPUT
          else
            echo "No KEYSTORE_BASE64 secret provided. Using built-in debug fallback."
            echo "KEYSTORE_EXISTS=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Release APK with Gradle
        env:
          KEYSTORE_PATH: ${{ steps.setup-keystore.outputs.KEYSTORE_EXISTS == 'true' && format('{0}/release.keystore', github.workspace) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          gradle assembleRelease --stacktrace

      - name: Verify APK Signatures (v1, v2, v3, v4)
        run: |
          APK_FILE=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            echo "Found APK: $APK_FILE"
            # Verify signature using Android apksigner tool
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose "$APK_FILE" || true
            sha256sum "$APK_FILE" > "${APK_FILE}.sha256"
            echo "APK SHA-256:"
            cat "${APK_FILE}.sha256"
          else
            echo "Error: Release APK not found!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHEN-tunnel-ZERO-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.sha256
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
